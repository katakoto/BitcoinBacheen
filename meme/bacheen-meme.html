<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoinバチーン！ミームアニメーション</title>
<link rel="icon" href="/favicon.png">\n    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Boogaloo&family=M+PLUS+Rounded+1c:wght@900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
  }

  .stage {
    width: 480px;
    height: 480px;
    background: #0a0a0a;
    border: 4px solid #F5A623;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ── FLASH ── */
  .flash {
    position: absolute; inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  /* ── LIGHTNING ── */
  .lightning {
    position: absolute;
    font-size: 48px;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    filter: drop-shadow(0 0 12px #F5A623);
  }

  /* ── MAIN TEXT ── */
  .txt-bacheen {
    position: absolute;
    top: 80px;
    width: 100%;
    text-align: center;
    font-family: 'Boogaloo', sans-serif;
    font-size: 68px;
    color: #F5A623;
    letter-spacing: 4px;
    text-shadow: 0 0 30px rgba(245,166,35,0.8), 4px 4px 0 rgba(0,0,0,0.6);
    opacity: 0;
    transform: scale(0.3);
    line-height: 1.1;
    z-index: 10;
  }

  .txt-subtitle-1 {
    position: absolute;
    top: 248px;
    width: 100%;
    text-align: center;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255,255,255,0.4);
    opacity: 0;
    transform: scale(0.4);
    z-index: 10;
  }

  .txt-subtitle-2 {
    position: absolute;
    top: 300px;
    width: 100%;
    text-align: center;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 44px;
    font-weight: 900;
    color: #F5A623;
    letter-spacing: 6px;
    text-shadow: 0 0 30px rgba(245,166,35,0.9), 3px 3px 0 rgba(0,0,0,0.5);
    opacity: 0;
    transform: scale(0.4);
    z-index: 10;
  }

  .txt-en {
    position: absolute;
    top: 362px;
    width: 100%;
    text-align: center;
    font-family: 'Zen Dots', sans-serif;
    font-size: 13px;
    color: #888;
    letter-spacing: 2px;
    opacity: 0;
    transform: translateY(10px);
    z-index: 10;
  }

  /* ── MASCOT ── */
  .mascot {
    position: absolute;
    bottom: -480px;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 2;
    border-radius: 8px;
  }

  /* ── PARTICLE SPARKS ── */
  .spark {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #F5A623;
    pointer-events: none;
    opacity: 0;
  }

  /* ── CONTROLS ── */
  .controls {
    margin-top: 16px;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .replay-hint {
    font-family: 'Zen Dots', sans-serif;
    font-size: 13px;
    color: #888;
    letter-spacing: 2px;
    cursor: pointer;
    transition: color .2s;
  }
  .replay-hint:hover { color: #F5A623; }
  .gif-btn {
    font-family: 'Zen Dots', sans-serif;
    font-size: 13px;
    color: #0a0a0a;
    background: #F5A623;
    letter-spacing: 2px;
    cursor: pointer;
    padding: 8px 18px;
    border-radius: 20px;
    transition: background .2s, opacity .2s;
    white-space: nowrap;
  }
  .gif-btn:hover { background: #ffc045; }
  .gif-btn.disabled { opacity: 0.5; cursor: default; pointer-events: none; }

  /* ── SCANLINES overlay ── */
  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 200;
    border-radius: 8px;
  }

  /* ── VIGNETTE ── */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 10;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- overlays -->
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>

  <!-- lightnings -->
  <span class="lightning" id="lt0" style="top:18px;left:18px">⚡</span>
  <span class="lightning" id="lt1" style="top:18px;right:18px">⚡</span>
  <span class="lightning" id="lt2" style="bottom:18px;left:18px">⚡</span>
  <span class="lightning" id="lt3" style="bottom:18px;right:18px">⚡</span>
  <span class="lightning" id="lt4" style="top:50%;left:18px;transform:translateY(-50%)">⚡</span>
  <span class="lightning" id="lt5" style="top:50%;right:18px;transform:translateY(-50%)">⚡</span>

  <!-- text layers -->
  <div class="txt-bacheen" id="txtBacheen">Bitcoin<br>バチーン！</div>
  <div class="txt-subtitle-1" id="txtSub1">お金の常識を、</div>
  <div class="txt-subtitle-2" id="txtSub2">ぶっ壊せ。</div>
  <div class="txt-en" id="txtEn">Smash the money myth.</div>

  <!-- mascot -->
  <img src="../icon/bitcoin.jpg" class="mascot" id="mascot" alt="Bitcoinくん">
</div>

<div class="controls">
  <div class="replay-hint" id="replayBtn">▶ REPLAY</div>
  <div class="gif-btn" id="gifBtn">⬇ GIF保存</div>
</div>

<script>
// ── UTILS ──────────────────────────────────────
function animate(el, props, duration, easing, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      el.style.transition = `all ${duration}ms ${easing || 'ease'}`;
      Object.entries(props).forEach(([k,v]) => el.style[k] = v);
      setTimeout(resolve, duration);
    }, delay || 0);
  });
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function flash(el, opacity, duration) {
  el.style.transition = `opacity ${duration}ms ease`;
  el.style.opacity = opacity;
  return wait(duration);
}

// ── LIGHTNING FLASH ─────────────────────────────
async function lightningBurst() {
  const lts = [0,1,2,3,4,5].map(i => document.getElementById('lt'+i));
  const rounds = 5;
  for (let r = 0; r < rounds; r++) {
    // pick random subset
    const picks = lts.filter(() => Math.random() > 0.4);
    picks.forEach(lt => {
      lt.style.transition = 'opacity 40ms ease';
      lt.style.opacity = '1';
    });
    await wait(60);
    lts.forEach(lt => {
      lt.style.transition = 'opacity 80ms ease';
      lt.style.opacity = '0';
    });
    await wait(90 + Math.random() * 60);
  }
}

// ── SPARKS ─────────────────────────────────────
function spawnSparks(stage) {
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const x = 60 + Math.random() * 360;
    const y = 60 + Math.random() * 360;
    const tx = (Math.random() - 0.5) * 120;
    const ty = (Math.random() - 0.5) * 120;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.background = Math.random() > 0.5 ? '#F5A623' : '#ffffff';
    stage.appendChild(s);
    setTimeout(() => {
      s.style.transition = `all ${300 + Math.random()*300}ms ease-out`;
      s.style.opacity = '1';
      s.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
    }, 10);
    setTimeout(() => s.remove(), 700);
  }
}

// ── RESET ──────────────────────────────────────
function setNoTransition(el, props) {
  el.style.transition = 'none';
  Object.entries(props).forEach(([k,v]) => el.style[k] = v);
}
function reset() {
  setNoTransition(document.getElementById('flash'), { opacity: '0' });
  setNoTransition(document.getElementById('txtBacheen'), { opacity: '0', transform: 'scale(0.3)' });
  setNoTransition(document.getElementById('txtSub1'), { opacity: '0', transform: 'scale(0.4)' });
  setNoTransition(document.getElementById('txtSub2'), { opacity: '0', transform: 'scale(0.4)' });
  setNoTransition(document.getElementById('txtEn'), { opacity: '0', transform: 'translateY(10px)' });
  setNoTransition(document.getElementById('mascot'), { opacity: '1', bottom: '-480px' });
  [0,1,2,3,4,5].forEach(i => setNoTransition(document.getElementById('lt'+i), { opacity: '0' }));
  document.querySelectorAll('.spark').forEach(s => s.remove());
}

// ── MAIN SEQUENCE ──────────────────────────────
async function runSequence() {
  const stage = document.getElementById('stage');
  const flashEl = document.getElementById('flash');
  const bacheen = document.getElementById('txtBacheen');
  const sub1 = document.getElementById('txtSub1');
  const sub2 = document.getElementById('txtSub2');
  const enTxt = document.getElementById('txtEn');
  const mascot = document.getElementById('mascot');

  reset();
  await wait(100);

  // 1. 白フラッシュ①
  await flash(flashEl, '1', 80);
  await flash(flashEl, '0', 180);
  await wait(120);

  // 2. 稲妻エフェクト
  await lightningBurst();
  await wait(200);

  // 3. 「Bitcoinバチーン！」スケールイン
  spawnSparks(stage);
  bacheen.style.transition = 'opacity 300ms ease, transform 400ms cubic-bezier(0.175,0.885,0.32,1.4)';
  bacheen.style.opacity = '1';
  bacheen.style.transform = 'scale(1)';
  await wait(600);

  // 4. 白フラッシュ②（軽め）
  await flash(flashEl, '0.6', 80);
  await flash(flashEl, '0', 150);
  await wait(250);

  // 5. 「お金の常識を、」スケールイン
  sub1.style.transition = 'opacity 300ms ease, transform 380ms cubic-bezier(0.175,0.885,0.32,1.4)';
  sub1.style.opacity = '1';
  sub1.style.transform = 'scale(1)';
  await wait(500);

  // 6. 「ぶっ壊せ。」スケールイン
  sub2.style.transition = 'opacity 300ms ease, transform 400ms cubic-bezier(0.175,0.885,0.32,1.4)';
  sub2.style.opacity = '1';
  sub2.style.transform = 'scale(1)';
  spawnSparks(stage);
  await wait(400);

  // 7. 「Smash the money myth.」（ぶっ壊せ。の直後）
  enTxt.style.transition = 'opacity 400ms ease, transform 400ms ease';
  enTxt.style.opacity = '1';
  enTxt.style.transform = 'translateY(0)';
  await wait(3000); // ここから3秒キープ

  // 8. 全テキストフェードアウト
  [bacheen, sub1, sub2, enTxt].forEach(el => {
    el.style.transition = 'opacity 400ms ease';
    el.style.opacity = '0';
  });
  await wait(450);

  // 9. マスコットが全画面スライドイン
  mascot.style.transition = 'bottom 900ms cubic-bezier(0.175,0.885,0.32,1.2)';
  mascot.style.bottom = '0';
  await wait(1000);

  // 10. 締め稲妻
  await lightningBurst();
}

// ── CONTROLS ───────────────────────────────────
let running = false;
async function start() {
  if (running) return;
  running = true;
  await runSequence();
  running = false;
}

document.getElementById('stage').addEventListener('click', start);
document.getElementById('replayBtn').addEventListener('click', start);

// ── GIF RECORDING ──────────────────────────────
async function recordGif() {
  if (running) return;
  const btn = document.getElementById('gifBtn');
  btn.classList.add('disabled');

  // gif.worker.js をblobとしてロード（クロスオリジン回避）
  btn.textContent = '⏳ 準備中...';
  let workerUrl;
  try {
    const res = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
    const blob = await res.blob();
    workerUrl = URL.createObjectURL(blob);
  } catch(e) {
    btn.textContent = '⚠ 読込失敗';
    btn.classList.remove('disabled');
    return;
  }

  const stage = document.getElementById('stage');
  const gif = new GIF({
    workers: 2,
    quality: 8,
    width: 480,
    height: 480,
    workerScript: workerUrl
  });

  const FRAME_MS = 80; // ~12fps
  let capturing = true;
  let frameCount = 0;

  btn.textContent = '⏺ 録画中...';

  // 逐次フレームキャプチャ（html2canvasの速度に追従）
  async function captureLoop() {
    while (capturing) {
      const t0 = Date.now();
      try {
        const canvas = await html2canvas(stage, {
          scale: 1, useCORS: true, allowTaint: true,
          logging: false, width: 480, height: 480
        });
        gif.addFrame(canvas, { delay: FRAME_MS, copy: true });
        frameCount++;
      } catch(e) {}
      const elapsed = Date.now() - t0;
      if (elapsed < FRAME_MS) await wait(FRAME_MS - elapsed);
    }
  }

  // アニメーションと並走してキャプチャ
  captureLoop();
  running = true;
  await runSequence();
  await wait(600); // マスコット表示後に数フレーム余白
  capturing = false;
  running = false;
  await wait(300);

  btn.textContent = `⚙ エンコード中 (${frameCount}f)...`;

  gif.on('finished', blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bacheen-meme.gif';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      URL.revokeObjectURL(workerUrl);
    }, 1000);
    btn.textContent = '⬇ GIF保存';
    btn.classList.remove('disabled');
  });

  gif.render();
}

document.getElementById('gifBtn').addEventListener('click', recordGif);

// 自動スタート
window.addEventListener('load', () => setTimeout(start, 400));
</script>
</body>
</html>
